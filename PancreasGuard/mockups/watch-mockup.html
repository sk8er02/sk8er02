<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; background: #000; display: flex; justify-content: center; align-items: center; gap: 40px; padding: 40px; min-height: 100vh; }

.watch { width: 198px; height: 242px; background: #1c1c1e; border-radius: 40px; padding: 12px; position: relative; border: 3px solid #444; }
.watch-screen { width: 100%; height: 100%; border-radius: 30px; overflow: hidden; background: #000; padding: 8px; }
.watch-label { text-align: center; color: #8e8e93; font-size: 13px; margin-top: 12px; }

/* Normal state */
.w-title { color: white; font-size: 16px; font-weight: 700; text-align: center; padding: 4px 0; }
.w-risk { display: flex; flex-direction: column; align-items: center; padding: 8px; margin: 6px 0; border-radius: 12px; }
.w-risk.green { background: rgba(52,199,89,0.15); }
.w-risk.red { background: rgba(255,69,58,0.15); }
.w-risk-dot { width: 20px; height: 20px; border-radius: 50%; margin-bottom: 4px; }
.w-risk-dot.green { background: #34c759; }
.w-risk-dot.red { background: #ff453a; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
.w-risk-text { color: white; font-size: 12px; font-weight: 600; }

.w-hr { display: flex; align-items: center; gap: 6px; padding: 8px 10px; margin: 6px 0; background: rgba(255,255,255,0.08); border-radius: 10px; }
.w-hr.alert { background: rgba(255,69,58,0.12); border: 1px solid rgba(255,69,58,0.3); }
.w-hr-icon { color: #ff3b30; font-size: 16px; }
.w-hr-value { color: white; font-size: 24px; font-weight: 700; }
.w-hr-value.danger { color: #ff453a; }
.w-hr-unit { color: #8e8e93; font-size: 11px; }

.w-btn { display: block; width: 100%; padding: 10px; background: #007aff; border-radius: 10px; color: white; font-size: 13px; font-weight: 600; text-align: center; margin-top: 6px; }
.w-btn.red { background: #ff453a; }

/* Quick log */
.w-slider-label { color: white; font-size: 13px; font-weight: 600; text-align: center; margin: 6px 0 2px; }
.w-slider { width: 100%; height: 6px; background: #38383a; border-radius: 3px; position: relative; margin: 4px 0; }
.w-slider-fill { height: 100%; border-radius: 3px; }
.w-toggle { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
.w-toggle-label { color: white; font-size: 12px; }
.w-toggle-switch { width: 36px; height: 20px; border-radius: 10px; position: relative; }
.w-toggle-switch.on { background: #34c759; }
.w-toggle-switch.off { background: #38383a; }
.w-toggle-knob { width: 16px; height: 16px; background: white; border-radius: 50%; position: absolute; top: 2px; }
.w-toggle-knob.on { right: 2px; }
.w-toggle-knob.off { left: 2px; }

.w-signal-row { display: flex; align-items: center; gap: 4px; padding: 3px 0; }
.w-signal-icon { color: #ff9500; font-size: 10px; }
.w-signal-text { color: white; font-size: 10px; }
</style>
</head>
<body>

<!-- Watch: Normal State -->
<div>
<div class="watch">
  <div class="watch-screen">
    <div class="w-title">PG</div>
    <div class="w-risk green">
      <div class="w-risk-dot green"></div>
      <div class="w-risk-text">Normal</div>
    </div>
    <div class="w-hr">
      <span class="w-hr-icon">&#x2764;</span>
      <span class="w-hr-value">74</span>
      <span class="w-hr-unit">bpm</span>
    </div>
    <div class="w-btn">+ Log Symptoms</div>
  </div>
</div>
<div class="watch-label">Normal State</div>
</div>

<!-- Watch: Alert State -->
<div>
<div class="watch">
  <div class="watch-screen">
    <div class="w-title" style="color:#ff453a">&#x26A0; PG</div>
    <div class="w-risk red">
      <div class="w-risk-dot red"></div>
      <div class="w-risk-text" style="color:#ff453a">Seek Care</div>
    </div>
    <div class="w-hr alert">
      <span class="w-hr-icon">&#x2764;</span>
      <span class="w-hr-value danger">112</span>
      <span class="w-hr-unit">bpm</span>
    </div>
    <div class="w-signal-row"><span class="w-signal-icon">&#x26A0;</span><span class="w-signal-text">HR elevated, HRV dropped 45%</span></div>
    <div class="w-signal-row"><span class="w-signal-icon">&#x26A0;</span><span class="w-signal-text">Temp +1.8°C, SpO2 92%</span></div>
    <div class="w-btn red">Seek Medical Care</div>
  </div>
</div>
<div class="watch-label">Alert State</div>
</div>

<!-- Watch: Quick Log -->
<div>
<div class="watch">
  <div class="watch-screen">
    <div class="w-title">Quick Log</div>
    <div class="w-slider-label">Pain: 7/10</div>
    <div class="w-slider"><div class="w-slider-fill" style="width:70%;background:#ff453a;border-radius:3px;"></div></div>
    <div class="w-toggle">
      <span class="w-toggle-label">Nausea</span>
      <div class="w-toggle-switch on"><div class="w-toggle-knob on"></div></div>
    </div>
    <div class="w-toggle">
      <span class="w-toggle-label">Vomiting</span>
      <div class="w-toggle-switch off"><div class="w-toggle-knob off"></div></div>
    </div>
    <div class="w-btn" style="margin-top:10px;">&#x2713; Save</div>
  </div>
</div>
<div class="watch-label">Quick Symptom Log</div>
</div>

</body>
</html>
